name: Analyze and publish

on:
  schedule:
    # Every weekday evening after EDGAR stops accepting filings (10pm New York time).
    # 03:15 UTC Tue-Sat = 11:15pm EDT / 10:15pm EST, Mon-Fri.
    - cron: "15 3 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous filings and data
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            site/data
          # run_attempt too: cache keys cannot be overwritten, so a re-run needs its own key to save its data.
          key: data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-

      # Code pushes reuse the last analysis so design changes deploy in a minute.
      # Scheduled and manual runs always analyze fresh data.
      # If analysis fails, the site keeps the last good data (restored above) instead of going dark.
      # The step timeout matters: a job timeout would skip the deploy, but a timed-out step is just a failed one.
      - name: Analyze today's market data
        id: analyze
        if: github.event_name != 'push' || hashFiles('site/data/meta.json') == ''
        continue-on-error: true
        timeout-minutes: 170
        env:
          # "Your Name you@example.com". The SEC rejects github.com addresses.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pipeline.build

      - name: Save filings and data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            site/data
          key: data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Flag a failed analysis
        if: steps.analyze.outcome == 'failure'
        run: echo "::warning title=Analysis failed::Today's analysis did not finish. The site was published with the most recent data that did. Check the 'Analyze today's market data' step log."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
